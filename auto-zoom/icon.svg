<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ══════════════════════════════════════════════════════════
       AUTO ZOOM — icon
       A page held in a "fit to screen" viewfinder, with a centered
       focus ring standing in for the cursor — echoes Fit Page/Fit
       Width, Auto Focus and Auto Cursor Align in one small mark.
       Matches the host's #1976d2 accent; transparent background so
       it drops cleanly into the sidebar/modal chrome.
  ═══════════════════════════════════════════════════════════ -->
  <defs>
    <linearGradient id="azPageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f2fd"/>
      <stop offset="1" stop-color="#bbdefb"/>
    </linearGradient>
  </defs>

  <!-- page -->
  <rect x="38" y="20" width="52" height="88" rx="6" fill="url(#azPageGrad)" stroke="#1976d2" stroke-width="4"/>
  <rect x="48" y="34" width="32" height="5" rx="2.5" fill="#64b5f6"/>
  <rect x="48" y="46" width="32" height="5" rx="2.5" fill="#64b5f6"/>
  <rect x="48" y="58" width="20" height="5" rx="2.5" fill="#90caf9"/>

  <!-- centered focus ring (auto focus / cursor align) -->
  <circle cx="64" cy="83" r="14" fill="#ffffff" stroke="#1976d2" stroke-width="4"/>
  <circle cx="64" cy="83" r="4" fill="#1976d2"/>

  <!-- viewfinder corners (auto zoom / fit to screen) -->
  <g fill="none" stroke="#1976d2" stroke-width="6" stroke-linecap="round">
    <path d="M10 30 V16 a6 6 0 0 1 6 -6 H30"/>
    <path d="M98 10 H112 a6 6 0 0 1 6 6 V30"/>
    <path d="M118 98 V112 a6 6 0 0 1 -6 6 H98"/>
    <path d="M30 118 H16 a6 6 0 0 1 -6 -6 V98"/>
  </g>
</svg>
