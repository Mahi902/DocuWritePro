<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Collab Screen</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f4f8;
    }

    html.dark, body.dark {
      background: #111;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
  <script>
    (function() {
      const match = document.cookie.split('; ').find(r => r.startsWith('toolsuite_theme='));
      const isDark = match && match.split('=')[1] === 'dark';

      document.documentElement.classList.add(isDark ? 'dark' : 'light');

      document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.add(isDark ? 'dark' : 'light');
        
        const iframe = document.getElementById('sceditorFrame');
        const hash = isDark ? '#collabd' : '#collabl';
        iframe.src = `https://mahi902.github.io/DocuWritePro/sceditor.html${hash}`;
      });
    })();
  </script>
</head>
<body>

  <iframe id="sceditorFrame" title="DocuWrite SCEditor"></iframe>

</body>
</html>
