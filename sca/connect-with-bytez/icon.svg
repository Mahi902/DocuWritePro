<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      .pulse-node {
        animation: pulse 2.5s infinite alternate ease-in-out;
        transform-origin: 256px 256px;
      }
      .ring-rotate {
        animation: rotate 20s linear infinite;
        transform-origin: 256px 256px;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.85; }
        100% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>

  <!-- Circuit Background Grid -->
  <g stroke="#1d4ed8" stroke-width="2" opacity="0.25" stroke-dasharray="6,6">
    <path d="M 80,256 H 432" />
    <path d="M 256,80 V 432" />
    <path d="M 132,132 L 380,380" />
    <path d="M 380,132 L 132,380" />
  </g>

  <!-- Tech Rings -->
  <g class="ring-rotate">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="50 20 10 20" opacity="0.6"/>
    <circle cx="256" cy="256" r="165" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="90 30 15 30" opacity="0.4"/>
  </g>

  <!-- Connection Cable Pathways -->
  <!-- Left Side: Connector -->
  <path d="M 60,256 C 140,256 160,256 190,256" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <rect x="160" y="234" width="44" height="44" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
  <path d="M 204,244 H 218 M 204,256 H 222 M 204,268 H 218" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Side: Bytez Plug Node -->
  <path d="M 452,256 C 372,256 352,256 322,256" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <rect x="308" y="234" width="44" height="44" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
  <!-- Byte Bits -->
  <circle cx="322" cy="246" r="4" fill="#60a5fa"/>
  <circle cx="338" cy="246" r="4" fill="#60a5fa"/>
  <circle cx="322" cy="266" r="4" fill="#60a5fa"/>
  <circle cx="338" cy="266" r="4" fill="#60a5fa"/>

  <!-- Central Glowing Connection Core -->
  <g class="pulse-node">
    <circle cx="256" cy="256" r="72" fill="#1d4ed8" filter="url(#core-glow)" opacity="0.6"/>
    <circle cx="256" cy="256" r="56" fill="#2563eb" stroke="#93c5fd" stroke-width="4"/>
    <circle cx="256" cy="256" r="38" fill="#3b82f6"/>
    <circle cx="256" cy="256" r="20" fill="#eff6ff"/>

    <!-- Central Spark/Bolt -->
    <path d="M 256,238 L 248,258 H 262 L 254,274" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="140" cy="150" r="5" fill="#60a5fa"/>
  <circle cx="370" cy="140" r="6" fill="#3b82f6"/>
  <circle cx="130" cy="360" r="6" fill="#2563eb"/>
  <circle cx="380" cy="350" r="5" fill="#93c5fd"/>
</svg>
