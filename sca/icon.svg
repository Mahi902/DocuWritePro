<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1677ff"/>
      <stop offset="100%" stop-color="#0047d9"/>
    </linearGradient>

    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd91a"/>
      <stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
                    flood-color="#001f7a" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Blue background -->
  <rect width="512" height="512" rx="96" fill="url(#blue)"/>

  <!-- Flower petals -->
  <g fill="url(#yellow)" filter="url(#shadow)">

    <!-- Top -->
    <path d="
      M256 250
      C207 194 206 132 256 78
      C306 132 305 194 256 250 Z"/>

    <!-- Right -->
    <path d="
      M270 256
      C326 207 388 206 442 256
      C388 306 326 305 270 256 Z"/>

    <!-- Bottom -->
    <path d="
      M256 270
      C305 326 306 388 256 442
      C206 388 207 326 256 270 Z"/>

    <!-- Left -->
    <path d="
      M242 256
      C186 305 124 306 70 256
      C124 206 186 207 242 256 Z"/>
  </g>

  <!-- Bee wings -->
  <g fill="#ffffff" stroke="#dbeafe" stroke-width="3">

    <ellipse
      cx="190"
      cy="185"
      rx="82"
      ry="42"
      transform="rotate(35 190 185)"/>

    <ellipse
      cx="177"
      cy="253"
      rx="78"
      ry="34"
      transform="rotate(-12 177 253)"/>
  </g>

  <!-- Bee body -->
  <g filter="url(#shadow)">

    <!-- Tail -->
    <path d="
      M145 337
      L94 375
      L123 316
      Z"
      fill="#071b50"/>

    <!-- Body -->
    <ellipse
      cx="220"
      cy="284"
      rx="105"
      ry="66"
      transform="rotate(-25 220 284)"
      fill="#071b50"/>

    <!-- Yellow stripes -->
    <path d="
      M181 236
      C201 225 217 222 233 225
      L257 292
      C247 307 235 317 219 325
      Z"
      fill="#ffd21c"/>

    <path d="
      M236 220
      C251 222 265 228 277 237
      L293 282
      C287 298 278 310 264 319
      L244 299
      Z"
      fill="#ffd21c"/>

    <!-- Head -->
    <circle
      cx="310"
      cy="219"
      r="58"
      fill="#071b50"/>

    <!-- Eye -->
    <circle cx="326" cy="202" r="22" fill="#ffffff"/>
    <circle cx="332" cy="198" r="10" fill="#071b50"/>

    <!-- Antennae -->
    <path d="
      M304 164
      C303 139 314 120 331 107"
      fill="none"
      stroke="#071b50"
      stroke-width="9"
      stroke-linecap="round"/>

    <path d="
      M330 169
      C339 145 357 133 375 128"
      fill="none"
      stroke="#071b50"
      stroke-width="9"
      stroke-linecap="round"/>

    <circle cx="334" cy="104" r="12" fill="#071b50"/>
    <circle cx="378" cy="127" r="12" fill="#071b50"/>

  </g>

  <!-- Small highlight -->
  <ellipse
    cx="165"
    cy="174"
    rx="34"
    ry="12"
    transform="rotate(35 165 174)"
    fill="#ffffff"
    opacity=".45"/>

</svg>
