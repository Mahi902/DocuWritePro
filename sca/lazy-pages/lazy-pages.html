<template id="lpSidebarTpl">
  <div class="sb-section" id="lpSbSection">
    <div class="aw-header" id="lpHeader">
      <span class="aw-header-label aw-label-blue" style="font-weight:700">Lazy Pages</span>
      <div class="aw-header-right">
        <span class="material-symbols-outlined aw-chevron" id="lpChevron">expand_more</span>
      </div>
    </div>
    <div class="aw-dropdown" id="lpDropdown">
      <div class="aw-inner" style="padding:4px 0 2px;">
        <div class="aw-row" onclick="event.stopPropagation()">
          <div>
            <div class="aw-row-label">Enable Lazy Pages</div>
            <div class="aw-row-sub">Keep only nearby pages in memory</div>
          </div>
          <label class="toggle-switch"><input type="checkbox" id="lpEnableToggle"/><span class="toggle-slider"></span></label>
        </div>
        <div class="aw-row" style="cursor:pointer" id="lpModsBtn">
          <div>
            <div class="aw-row-label">Settings</div>
            <div class="aw-row-sub">Window, scrolling, unloading, rules</div>
          </div>
          <span class="material-symbols-outlined" style="font-size:18px;color:#1976d2">tune</span>
        </div>
      </div>
    </div>
  </div>
</template>

<div class="lp-badge" id="lpBadge">
  <span class="material-symbols-outlined">layers</span>
  <span id="lpBadgeText"></span>
  <button type="button" class="lp-badge-all" id="lpBadgeAll">Load all</button>
</div>

<div class="modal" id="lazyPagesMdl">
  <div class="mbox wide">
    <div class="mhdr">
      <h2 class="mtitle">Lazy Pages</h2>
      <button class="mclose" onclick="closeMdl('lazyPagesMdl')"><span class="material-symbols-outlined">close</span></button>
    </div>

    <div class="lp-status" id="lpStatus"></div>

    <div class="sm-section"><div class="sm-label">Loading window</div><div id="lpWindowBox"></div></div>
    <div class="sm-section"><div class="sm-label">Scrolling</div><div id="lpScrollBox"></div></div>
    <div class="sm-section"><div class="sm-label">Unloading</div><div id="lpUnloadBox"></div></div>
    <div class="sm-section"><div class="sm-label">Background loading</div><div id="lpAutoBox"></div></div>
    <div class="sm-section"><div class="sm-label">When lazy mode applies</div><div id="lpRuleBox"></div></div>
    <div class="sm-section"><div class="sm-label">On document open</div><div id="lpSourceBox"></div></div>
    <div class="sm-section"><div class="sm-label">Safety &amp; display</div><div id="lpSafetyBox"></div></div>

    <div class="mfooter" style="flex-wrap:wrap;justify-content:space-between">
      <button class="mbtn sec" id="lpResetBtn">Reset</button>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="mbtn sec" id="lpReapplyBtn">Re-apply</button>
        <button class="mbtn sec" id="lpUnloadBtn">Unload distant</button>
        <button class="mbtn primary" id="lpLoadAllBtn">Load all</button>
      </div>
    </div>
  </div>
</div>
