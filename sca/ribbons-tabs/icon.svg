<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
        </linearGradient>

        <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/>
        </filter>
    </defs>

    <!-- Application window -->
    <rect
        x="32"
        y="40"
        width="448"
        height="432"
        rx="34"
        fill="url(#bg)"
        stroke="#2563eb"
        stroke-width="8"
        filter="url(#shadow)"
    />

    <!-- Ribbon tab area -->
    <path
        d="M36 74
           Q36 44 66 44
           H446
           Q476 44 476 74
           V148
           H36
           Z"
        fill="url(#ribbon)"
    />

    <!-- Active tab -->
    <path
        d="M68 88
           Q68 72 84 72
           H160
           Q176 72 176 88
           V148
           H68
           Z"
        fill="#ffffff"
    />

    <!-- Tabs -->
    <text
        x="122"
        y="120"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#2563eb"
    >
        Text
    </text>

    <text
        x="225"
        y="120"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="600"
        fill="#ffffff"
    >
        Align
    </text>

    <text
        x="320"
        y="120"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="600"
        fill="#ffffff"
    >
        Insert
    </text>

    <text
        x="410"
        y="120"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="600"
        fill="#ffffff"
    >
        View
    </text>

    <!-- Ribbon body -->
    <rect
        x="48"
        y="148"
        width="416"
        height="138"
        rx="0"
        fill="#ffffff"
        stroke="#cbd5e1"
        stroke-width="2"
    />

    <!-- Text group -->
    <text
        x="105"
        y="178"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        fill="#64748b"
    >
        TEXT
    </text>

    <rect x="68" y="192" width="54" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text
        x="95"
        y="221"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        fill="#1e293b"
    >
        A
    </text>

    <rect x="130" y="192" width="38" height="42" rx="6" fill="#e2e8f0"/>
    <text
        x="149"
        y="220"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="700"
        fill="#1e293b"
    >
        B
    </text>

    <text
        x="184"
        y="220"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-style="italic"
        fill="#1e293b"
    >
        I
    </text>

    <!-- Divider -->
    <line
        x1="210"
        y1="168"
        x2="210"
        y2="264"
        stroke="#cbd5e1"
        stroke-width="2"
    />

    <!-- Alignment group -->
    <text
        x="270"
        y="178"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        fill="#64748b"
    >
        ALIGNMENT
    </text>

    <!-- Align left -->
    <line x1="228" y1="198" x2="266" y2="198" stroke="#334155" stroke-width="5"/>
    <line x1="228" y1="208" x2="258" y2="208" stroke="#334155" stroke-width="5"/>
    <line x1="228" y1="218" x2="266" y2="218" stroke="#334155" stroke-width="5"/>

    <!-- Align center -->
    <line x1="284" y1="198" x2="322" y2="198" stroke="#334155" stroke-width="5"/>
    <line x1="291" y1="208" x2="315" y2="208" stroke="#334155" stroke-width="5"/>
    <line x1="284" y1="218" x2="322" y2="218" stroke="#334155" stroke-width="5"/>

    <!-- Divider -->
    <line
        x1="340"
        y1="168"
        x2="340"
        y2="264"
        stroke="#cbd5e1"
        stroke-width="2"
    />

    <!-- Insert group -->
    <text
        x="400"
        y="178"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        fill="#64748b"
    >
        INSERT
    </text>

    <!-- Bulleted list -->
    <circle cx="366" cy="200" r="4" fill="#334155"/>
    <circle cx="366" cy="214" r="4" fill="#334155"/>
    <circle cx="366" cy="228" r="4" fill="#334155"/>

    <line x1="376" y1="200" x2="412" y2="200" stroke="#334155" stroke-width="4"/>
    <line x1="376" y1="214" x2="412" y2="214" stroke="#334155" stroke-width="4"/>
    <line x1="376" y1="228" x2="412" y2="228" stroke="#334155" stroke-width="4"/>

    <!-- Collapse button -->
    <rect
        x="424"
        y="188"
        width="28"
        height="52"
        rx="7"
        fill="#f1f5f9"
        stroke="#cbd5e1"
    />

    <path
        d="M435 205 L443 214 L435 223"
        fill="none"
        stroke="#2563eb"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Document area -->
    <rect
        x="70"
        y="314"
        width="372"
        height="126"
        rx="16"
        fill="#ffffff"
        stroke="#dbe3ec"
        stroke-width="2"
    />

    <!-- Document lines -->
    <rect x="100" y="342" width="240" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="100" y="364" width="300" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="100" y="386" width="270" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="100" y="408" width="210" height="8" rx="4" fill="#cbd5e1"/>
</svg>
