<!-- ══════════════════════════════════════════════════════════════════
     TYPETONE — add-on markup. Sidebar section lives inside a
     <template>; typetone.js clones it into #sidebar right before
     Collapse, same pattern as every other Sugarcane add-on.
═══════════════════════════════════════════════════════════════════ -->

<template id="ttSidebarTpl">
<div class="sb-section" id="ttSbSection">
  <div class="aw-header" id="ttHeader">
    <span class="aw-header-label aw-label-blue">Typetone</span>
    <div class="aw-header-right">
      <span class="material-symbols-outlined aw-chevron" id="ttChevron">expand_more</span>
    </div>
  </div>
  <div class="aw-dropdown" id="ttDropdown">
    <div class="aw-inner">
      <div class="aw-row">
        <div>
          <div class="aw-row-label">Typetone Toggle</div>
          <div class="aw-row-sub">The ultimate typewriter feel</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="ttEnableToggle" checked/>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div style="padding:0 10px 8px">
        <button class="aw-correct-btn" id="ttModsBtn" style="background:#546e7a;width:100%">
          <span class="material-symbols-outlined" style="font-size:13px">tune</span>Modifications
        </button>
      </div>
    </div>
  </div>
</div>
</template>

<!-- Modifications modal -->
<div class="modal" id="ttSettingsMdl">
  <div class="mbox" style="max-width:560px">
    <div class="mhdr">
      <h2 class="mtitle"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;margin-right:6px;color:#1976d2">keyboard</span>Typetone</h2>
      <button class="mclose" onclick="closeMdl('ttSettingsMdl')"><span class="material-symbols-outlined">close</span></button>
    </div>

    <div class="sm-section">
      <div class="sm-label">Keyboard Style</div>
      <div class="scale-chip-row" id="ttStyleChips"></div>

      <div class="aw-row" style="margin-top:10px">
        <div>
          <div class="aw-row-label">Variation</div>
          <div class="aw-row-sub">Cycle a few slightly different clicks, like an iPhone keyboard</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="ttVariationToggle" checked/>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="sm-row" style="margin-top:10px">
        <span style="font-size:11.5px;color:#888;width:70px;flex-shrink:0">Volume</span>
        <input type="range" class="sm-slider" id="ttVolumeSlider" min="0" max="100" value="70"/>
        <span class="sm-val" id="ttVolumeVal">70%</span>
      </div>
    </div>

    <div style="height:1px;background:#e8f0f8;margin:6px 0 12px;"></div>

    <div class="sm-section">
      <div class="sm-label">Sound Library</div>
      <div class="tt-quick-row">
        <div class="tt-quick-btn" id="ttEnableAllBtn">Enable All</div>
        <div class="tt-quick-btn" id="ttDisableAllBtn">Disable All</div>
      </div>
      <div id="ttCategoryList"></div>
    </div>

    <div class="mfooter">
      <button class="mbtn sec" id="ttResetBtn">Reset to Defaults</button>
      <button class="mbtn primary" onclick="closeMdl('ttSettingsMdl')">Done</button>
    </div>
  </div>
</div>
